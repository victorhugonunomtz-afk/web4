<html>
<head>
    <title>Papeleria Jireh</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #34495e;
            text-align: center;
            font-family: Arial, sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        .header-container {
            padding: 10px 20px;
        }
        
        .header-container h1 {
            color: white;
            font-size: 2.5em;
            margin: 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .header-container p {
            color: #f0f0f0;
            font-size: 1.2em;
            margin-top: 10px;
        }
        

        .imagen {
            max-width: 210px;
            width: 90%;
            height: auto;
            object-fit: contain;
            margin-top: 5px;
            background-color: white;
            padding: 15px;
            border-radius: 50%;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
    </style>
</head>

<body>
    <img src="imagenes/Logo Tienda Ecológica Minimalista Beige.jpg" alt="Logo Papelería" class="imagen">
</body>
</html>
